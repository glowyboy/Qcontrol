name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Create .env file from secrets
      - name: Create .env file
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      # 5. Build Next.js as static export (outputs to /out)
      - name: Build Next.js static export
        run: npm run build

      # 6. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 7. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 8. Install Capacitor CLI and sync
      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      # 9. Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 10. Build debug APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # 11. Upload APK as artifact (download from Actions tab)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Q-Control-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
